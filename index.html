<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Skyline Contribution Grid Map</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            background: #0d1117; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            overflow-hidden: hidden;
        }
        /* Adjusted Transformation Matrix for Top-Down Isometric Angle Alignment */
        .skyline-iso-matrix {
            transform: rotateX(54.7deg) rotateZ(-45deg);
            transform-style: preserve-3d;
        }
        .block-wrapper {
            transform-style: preserve-3d;
            position: relative;
        }
        /* 3D Structural Prism Faces styling definitions */
        .prism-facet {
            position: absolute;
            bottom: 0;
            left: 0;
            transition: height 0.08s ease-out;
        }
        .prism-top {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: translateZ(var(--elevation, 8px));
            transition: transform 0.08s ease-out;
            box-shadow: 0 0 8px rgba(57, 211, 83, 0.25);
        }
        .prism-front {
            width: 100%;
            height: var(--elevation, 8px);
            transform: rotateX(-90deg);
            transform-origin: bottom;
        }
        .prism-side {
            width: var(--elevation, 8px);
            height: 100%;
            transform: rotateY(90deg);
            transform-origin: right;
            right: 0;
        }
    </style>
</head>
<body class="w-screen h-screen flex flex-col items-center justify-center text-slate-200 p-4 select-none">

    <div class="w-full max-w-4xl mb-4 flex justify-between items-center border-b border-zinc-800 pb-3">
        <div>
            <h1 class="text-md font-medium text-emerald-400 tracking-wider flex items-center gap-2 font-mono">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
                SKYLINE_TOP_DOWN_ENGINE.SYS
            </h1>
            <p class="text-xs text-zinc-500 mt-0.5 font-mono">Redirecting to profiles landing layout upon completion countdown...</p>
        </div>
        <div id="countdown-badge" class="text-xs font-mono px-3 py-1 bg-amber-500/10 border border-amber-500/20 text-amber-400 rounded">
            COMPILING METRICS: 6s
        </div>
    </div>

    <div class="relative w-full max-w-4xl h-[480px] bg-[#0d1117] border border-zinc-800/80 rounded-2xl flex items-center justify-center overflow-hidden shadow-2xl">
        
        <div id="tracker-node" class="absolute w-2.5 h-2.5 bg-rose-500 rounded-full shadow-[0_0_12px_#f43f5e] z-50 pointer-events-none transition-all duration-75"></div>

        <div class="skyline-iso-matrix grid grid-cols-7 grid-rows-4 gap-3 w-[460px] h-[260px] mt-[-40px]">
            <div id="dynamic-grid-mesh" class="contents"></div>
        </div>
    </div>

    <script>
        const canvasMesh = document.getElementById('dynamic-grid-mesh');
        const marker = document.getElementById('tracker-node');
        const ticker = document.getElementById('countdown-badge');
        
        const matrixSize = 28; // 7x4 Grid Architecture 
        let architecturalBlocks = [];
        let timeRemaining = 6; 

        // Sourced color spectrum from custom green color maps
        const shadingSpectrum = [
            { top: '#0e4429', front: '#0a301d', side: '#05180e' },
            { top: '#006d32', front: '#004d23', side: '#002e15' },
            { top: '#26a641', front: '#1b752e', side: '#10461c' },
            { top: '#39d353', front: '#28943a', side: '#185923' }
        ];

        // Generation loop building structural elements 
        for (let idx = 0; idx < matrixSize; idx++) {
            const wrap = document.createElement('div');
            wrap.className = 'block-wrapper w-full h-full';
            
            const colorGroupIndex = Math.floor(Math.random() * shadingSpectrum.length);
            const targetHeight = (colorGroupIndex * 24) + 12;
            const theme = shadingSpectrum[colorGroupIndex];

            wrap.innerHTML = `
                <div class="prism-facet prism-front w-full" style="background: ${theme.front};"></div>
                <div class="prism-facet prism-side h-full" style="background: ${theme.side};"></div>
                <div class="prism-top" style="background: ${theme.top};"></div>
            `;

            canvasMesh.appendChild(wrap);
            architecturalBlocks.push({
                domNode: wrap,
                currentH: 5,
                targetH: targetHeight
            });
        }

        let pipelineClock = 0;
        let activeCellPointer = 0;
        let jumpingInterpolation = 0;

        function runRenderPipeline() {
            pipelineClock++;

            // Wave transformations execution
            architecturalBlocks.forEach((block, i) => {
                let waveOscillator = Math.sin((pipelineClock * 0.05) + i) * 12;
                let responsiveHeight = Math.max(6, block.targetH + waveOscillator);
                
                block.currentH = responsiveHeight;
                block.domNode.style.setProperty('--elevation', `${responsiveHeight}px`);
                
                const surfaceFace = block.domNode.querySelector('.prism-top');
                if(surfaceFace) surfaceFace.style.transform = `translateZ(${responsiveHeight}px)`;
            });

            // Target positioning interpolation logic vectors
            jumpingInterpolation += 0.05;
            if(jumpingInterpolation >= 1) {
                jumpingInterpolation = 0;
                activeCellPointer = (activeCellPointer + 1) % matrixSize;
            }

            // Map standard layout frames safely to pin tracker coordinates
            const trackingTarget = architecturalBlocks[activeCellPointer].domNode;
            const boundaries = trackingTarget.getBoundingClientRect();
            const parentBoundaries = trackingTarget.parentElement.parentElement.getBoundingClientRect();
            
            const positionX = boundaries.left - parentBoundaries.left + (boundaries.width / 2);
            const currentElev = architecturalBlocks[activeCellPointer].currentH;
            
            const parabolicArc = Math.sin(jumpingInterpolation * Math.PI) * 40;
            const positionY = (boundaries.top - parentBoundaries.top) - currentElev - parabolicArc + 120;

            marker.style.left = `${positionX}px`;
            marker.style.top = `${positionY}px`;

            requestAnimationFrame(runRenderPipeline);
        }

        // Automatic exit redirect timer countdown matrix loop
        const timerCountdownWorker = setInterval(() => {
            timeRemaining--;
            if (timeRemaining <= 0) {
                clearInterval(timerCountdownWorker);
                ticker.innerText = "REDIRECTING NOW...";
                // Clean bounce routing link straight back onto your static profile view
                window.location.href = "https://github.com/Linux56ax";
            } else {
                ticker.innerText = `COMPILING METRICS: ${timeRemaining}s`;
            }
        }, 1000);

        runRenderPipeline();
    </script>
</body>
</html>
