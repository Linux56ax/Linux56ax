<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>GitHub Skyline Runner</title>

<style>
body{
    margin:0;
    background:#0d1117;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    color:white;
}

#ui{
    position:absolute;
    top:20px;
    left:20px;
    z-index:100;
}

button{
    background:#238636;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:8px;
    cursor:pointer;
}

canvas{
    display:block;
}
</style>
</head>
<body>

<div id="ui">
    <h2>GitHub Skyline Runner</h2>
    <p>SPACE / CLICK = Jump</p>

    <button onclick="window.open('https://github.com/Linux56ax','_blank')">
        Visit Linux56ax
    </button>

    <h3 id="score">Score: 0</h3>
</div>

<canvas id="game"></canvas>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize",resize);

const TILE_W = 40;
const TILE_H = 20;

const rows = 7;
const cols = 120;

const contributions = [];

for(let i=0;i<cols;i++){

    let value;

    if(Math.random() < 0.35){
        value = 0;
    }else{
        value = Math.floor(Math.random()*10)+1;
    }

    contributions.push(value);
}

const player = {
    x:120,
    y:0,
    vy:0,
    size:18,
    grounded:true
};

let cameraX = 0;
let speed = 3;
let gravity = 0.7;
let jumpForce = -12;
let score = 0;
let gameOver = false;

function iso(x,y,z){

    return {
        x:(x-y)*TILE_W/2,
        y:(x+y)*TILE_H/2-z
    };
}

function pillarHeight(value){
    return value*8;
}

function jump(){

    if(player.grounded && !gameOver){

        player.vy = jumpForce;
        player.grounded = false;
    }
}

window.addEventListener("keydown",e=>{
    if(e.code==="Space") jump();
});

window.addEventListener("mousedown",jump);
window.addEventListener("touchstart",jump);

function drawBlock(x,y,z,h,color){

    const p = iso(x,y,z);

    const sx = canvas.width/2 + p.x - cameraX;
    const sy = 250 + p.y;

    ctx.fillStyle = color;

    ctx.beginPath();
    ctx.moveTo(sx,sy);
    ctx.lineTo(sx+TILE_W/2,sy+TILE_H/2);
    ctx.lineTo(sx,sy+TILE_H);
    ctx.lineTo(sx-TILE_W/2,sy+TILE_H/2);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle="#3fb950";

    ctx.beginPath();
    ctx.moveTo(sx-TILE_W/2,sy+TILE_H/2);
    ctx.lineTo(sx,sy+TILE_H);
    ctx.lineTo(sx,sy+TILE_H+h);
    ctx.lineTo(sx-TILE_W/2,sy+TILE_H/2+h);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle="#2ea043";

    ctx.beginPath();
    ctx.moveTo(sx+TILE_W/2,sy+TILE_H/2);
    ctx.lineTo(sx,sy+TILE_H);
    ctx.lineTo(sx,sy+TILE_H+h);
    ctx.lineTo(sx+TILE_W/2,sy+TILE_H/2+h);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle="#56d364";

    ctx.beginPath();
    ctx.moveTo(sx,sy);
    ctx.lineTo(sx+TILE_W/2,sy+TILE_H/2);
    ctx.lineTo(sx,sy+TILE_H);
    ctx.lineTo(sx-TILE_W/2,sy+TILE_H/2);
    ctx.closePath();
    ctx.fill();

}

function update(){

    if(gameOver) return;

    score++;
    document.getElementById("score").innerHTML =
        "Score: "+Math.floor(score/10);

    player.vy += gravity;
    player.y += player.vy;

    if(player.y > 0){
        player.y = 0;
        player.vy = 0;
        player.grounded = true;
    }

    cameraX += speed;

    const playerWorld =
        Math.floor((cameraX+player.x)/TILE_W);

    if(playerWorld >= 0 &&
       playerWorld < contributions.length){

        const h =
            pillarHeight(contributions[playerWorld]);

        if(h > 24 && player.y > -h+24){

            gameOver = true;

            setTimeout(()=>{
                alert("Game Over!");
                location.reload();
            },100);
        }
    }
}

function draw(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    for(let c=0;c<cols;c++){

        for(let r=0;r<rows;r++){

            drawBlock(
                c,
                r,
                0,
                0,
                "#161b22"
            );
        }

        let h =
            pillarHeight(contributions[c]);

        if(h>0){

            drawBlock(
                c,
                3,
                -h,
                h,
                "#238636"
            );
        }
    }

    const p =
        iso(
            (cameraX+player.x)/TILE_W,
            3,
            player.y
        );

    const px =
        canvas.width/2 +
        p.x -
        cameraX;

    const py =
        250 +
        p.y -
        15;

    ctx.fillStyle="#58a6ff";

    ctx.fillRect(
        px-10,
        py-10,
        20,
        20
    );

}

function loop(){

    update();
    draw();

    requestAnimationFrame(loop);
}

loop();

</script>

</body>
</html>
