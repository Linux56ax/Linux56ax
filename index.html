<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skyline Contribution Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0d1117; font-family: monospace; overflow: hidden; }
        .isometric-view {
            transform: rotateX(55deg) rotateZ(-45deg);
            transform-style: preserve-3d;
        }
        .bar-stack {
            transform-style: preserve-3d;
            position: relative;
        }
        .face { position: absolute; bottom: 0; left: 0; transition: height 0.05s ease-out; }
        .top-cap {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            transform: translateZ(var(--h, 4px));
            transition: transform 0.05s ease-out;
        }
        .front-wall { width: 100%; height: var(--h, 4px); transform: rotateX(-90deg); transform-origin: bottom; }
        .side-wall { width: var(--h, 4px); height: 100%; transform: rotateY(90deg); transform-origin: right; right: 0; }
    </style>
</head>
<body class="w-screen h-screen flex flex-col items-center justify-center text-slate-300 p-6">

    <div class="w-full max-w-4xl mb-4 flex justify-between items-center border-b border-zinc-800 pb-2">
        <div class="font-bold text-emerald-400 tracking-wider">SKYLINE_GRID_SIMULATOR.SH</div>
        <div id="countdown" class="text-xs px-2.5 py-1 bg-amber-500/10 border border-amber-500/30 text-amber-400 rounded">
            INITIALIZING SYSTEM: 6s
        </div>
    </div>

    <div class="relative w-full max-w-4xl h-[460px] bg-[#161b22]/40 border border-zinc-800 rounded-2xl flex items-center justify-center overflow-hidden shadow-2xl">
        <div id="avatar-dot" class="absolute w-2.5 h-2.5 bg-rose-500 rounded-full shadow-[0_0_12px_#f43f5e] z-50 pointer-events-none transition-all duration-75"></div>
        <div class="isometric-view grid grid-cols-7 grid-rows-4 gap-4 w-[420px] h-[240px] mt-[-30px]">
            <div id="matrix-mesh" class="contents"></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('matrix-mesh');
        const dot = document.getElementById('avatar-dot');
        const timer = document.getElementById('countdown');
        
        const totalNodes = 28;
        let cells = [];
        let timeRemaining = 6;

        const colors = [
            { top: '#0e4429', front: '#0a301d', side: '#05180e' },
            { top: '#006d32', front: '#004d23', side: '#002e15' },
            { top: '#26a641', front: '#1b752e', side: '#10461c' },
            { top: '#39d353', front: '#28943a', side: '#185923' }
        ];

        for (let i = 0; i < totalNodes; i++) {
            const container = document.createElement('div');
            container.className = 'bar-stack w-full h-full';
            const variant = Math.floor(Math.random() * colors.length);
            const height = (variant * 25) + 15;
            const theme = colors[variant];

            container.innerHTML = `
                <div class="face front-wall w-full" style="background: ${theme.front};"></div>
                <div class="face side-wall h-full" style="background: ${theme.side};"></div>
                <div class="top-cap" style="background: ${theme.top};"></div>
            `;
            canvas.appendChild(container);
            cells.push({ el: container, currentH: 5, targetH: height });
        }

        let tick = 0, currentIdx = 0, lerp = 0;

        function updateScene() {
            tick++;
            cells.forEach((cell, i) => {
                let wave = Math.sin((tick * 0.05) + i) * 10;
                let h = Math.max(5, cell.targetH + wave);
                cell.currentH = h;
                cell.el.style.setProperty('--h', `${h}px`);
                const cap = cell.el.querySelector('.top-cap');
                if(cap) cap.style.transform = `translateZ(${h}px)`;
            });

            lerp += 0.05;
            if(lerp >= 1) { lerp = 0; currentIdx = (currentIdx + 1) % totalNodes; }

            const target = cells[currentIdx].el;
            const rect = target.getBoundingClientRect();
            const pRect = target.parentElement.parentElement.getBoundingClientRect();
            
            const px = rect.left - pRect.left + (rect.width / 2);
            const py = (rect.top - pRect.top) - cells[currentIdx].currentH - (Math.sin(lerp * Math.PI) * 35) + 100;

            dot.style.left = `${px}px`;
            dot.style.top = `${py}px`;

            requestAnimationFrame(updateScene);
        }

        const clockInterval = setInterval(() => {
            timeRemaining--;
            if (timeRemaining <= 0) {
                clearInterval(clockInterval);
                window.location.href = "https://github.com/Linux56ax";
            } else {
                timer.innerText = `INITIALIZING SYSTEM: ${timeRemaining}s`;
            }
        }, 1000);

        updateScene();
    </script>
</body>
</html>
