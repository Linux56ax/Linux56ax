<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Stats - Skyline Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            background: #0d1117; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            overflow-x: hidden;
        }
        /* True Isometric Transformation matrix matching the long ribbon in Screenshot From 2026-06-18 13-01-14_2.png */
        .skyline-ribbon-matrix {
            transform: rotateX(62deg) rotateZ(-45deg);
            transform-style: preserve-3d;
        }
        .block-wrapper {
            transform-style: preserve-3d;
            position: relative;
        }
        /* 3D Prism Faces Engine */
        .prism-facet {
            position: absolute;
            bottom: 0;
            left: 0;
            transition: height 0.1s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .prism-top {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: translateZ(var(--elevation, 2px));
            transition: transform 0.1s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .prism-front {
            width: 100%;
            height: var(--elevation, 2px);
            transform: rotateX(-90deg);
            transform-origin: bottom;
        }
        .prism-side {
            width: var(--elevation, 2px);
            height: 100%;
            transform: rotateY(90deg);
            transform-origin: right;
            right: 0;
        }
    </style>
</head>
<body class="w-screen h-screen flex flex-col items-center justify-center text-[#c9d1d9] p-4 select-none">

    <!-- MAIN DISPLAY BOX HOUSING MATCHING IMAGE THEME -->
    <div class="relative w-full max-w-5xl h-[620px] bg-[#0d1117] border border-zinc-800/60 rounded-xl flex flex-col justify-between p-6 shadow-2xl overflow-hidden">
        
        <!-- Header Text Components -->
        <div class="flex items-center gap-2 text-xl font-bold tracking-tight text-white mb-2">
            <span class="text-blue-500 font-mono">📊</span> GitHub Stats
        </div>

        <div class="w-full flex justify-between px-4 font-mono text-xs text-zinc-500 border-b border-zinc-900 pb-2">
            <div>SKYLINE MODULE: ACTIVE MODE</div>
            <div id="countdown-timer">REDIRECT: 8s</div>
        </div>

        <!-- THE SIMULATION ENCLOSURE CANVAS -->
        <div class="relative w-full h-[420px] flex items-center justify-start overflow-hidden">
            
            <!-- Automated jumping token tracker element -->
            <div id="tracker-node" class="absolute w-2.5 h-2.5 bg-rose-500 rounded-full shadow-[0_0_12px_#f43f5e] z-50 pointer-events-none transition-all duration-75"></div>

            <!-- 3D Long Skyline Ribbon Array -->
            <div class="skyline-ribbon-matrix grid grid-cols-24 grid-rows-4 gap-[3px] w-[950px] h-[160px] ml-[-80px] mt-[40px] border border-zinc-800/20 p-1 bg-[#161b22]/30">
                <div id="ribbon-mesh" class="contents"></div>
            </div>

            <!-- Sidebar Statistics Group overlay right-aligned mimicking the screenshot layout -->
            <div class="absolute right-6 top-12 w-64 flex flex-col gap-5 font-mono text-xs text-zinc-400 bg-[#0d1117]/90 p-4 rounded-lg border border-zinc-800/40 backdrop-blur-sm z-40">
                <div>
                    <div class="text-[#58a6ff] flex items-center gap-1">📊 Commits streaks</div>
                    <div class="pl-4 mt-1 text-slate-300">Current streak: <span class="text-emerald-400">1 day</span></div>
                    <div class="pl-4 text-slate-300">Best streak: <span class="text-emerald-400">15 days</span></div>
                </div>
                <div>
                    <div class="text-[#58a6ff] flex items-center gap-1">📈 Commits per day</div>
                    <div class="pl-4 mt-1 text-slate-300">Highest in a day: <span class="text-emerald-400">73</span></div>
                    <div class="pl-4 text-slate-300">Average per day: <span class="text-emerald-400">~2.25</span></div>
                </div>
            </div>
        </div>

        <!-- Simulated Language Color Bar Footer component -->
        <div class="w-full border-t border-zinc-900 pt-4 font-mono text-xs">
            <div class="text-zinc-500 mb-2 text-center">Most used languages</div>
            <div class="w-full h-2 rounded-full overflow-hidden flex mb-2">
                <div style="width: 45%" class="bg-[#da5b0b]"></div>
                <div style="width: 25%" class="bg-[#3572A5]"></div>
                <div style="width: 15%" class="bg-[#f1e05a]"></div>
                <div style="width: 15%" class="bg-[#3178c6]"></div>
            </div>
            <div class="flex flex-wrap justify-center gap-x-4 gap-y-1 text-[11px] text-zinc-400">
                <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-[#da5b0b]"></span> Jupyter Notebook</span>
                <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-[#3572A5]"></span> Python</span>
                <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-[#f1e05a]"></span> JavaScript</span>
                <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-[#3178c6]"></span> TypeScript</span>
            </div>
        </div>
    </div>

    <script>
        const meshContainer = document.getElementById('ribbon-mesh');
        const trackerNode = document.getElementById('tracker-node');
        const timerText = document.getElementById('countdown-timer');
        
        // 24 Columns x 4 Rows matrix replication setup
        const totalElements = 96; 
        let matrixBlocks = [];
        let countdown = 8;

        // Custom green shades sampled straight from the visual assets
        const greenShades = [
            { top: '#161b22', front: '#11151c', side: '#0d1117' }, // Empty base grid node
            { top: '#0e4429', front: '#0a301d', side: '#05180e' },
            { top: '#006d32', front: '#004d23', side: '#002e15' },
            { top: '#26a641', front: '#1b752e', side: '#10461c' },
            { top: '#39d353', front: '#28943a', side: '#185923' }  // Tall peaks
        ];

        // Layout creation loop mapping
        for (let idx = 0; idx < totalElements; idx++) {
            const block = document.createElement('div');
            block.className = 'block-wrapper w-full h-full border border-zinc-800/10';
            
            // Generate structured cluster groups resembling genuine developer activity grids
            let layerIndex = 0;
            if (Math.random() > 0.35) {
                layerIndex = Math.floor(Math.random() * greenShades.length);
            }
            
            // Map structural height factors
            const maxElevation = layerIndex === 0 ? 2 : (layerIndex * 22) + 6;
            const colors = greenShades[layerIndex];

            block.innerHTML = `
                <div class="prism-facet prism-front w-full" style="background: ${colors.front};"></div>
                <div class="prism-facet prism-side h-full" style="background: ${colors.side};"></div>
                <div class="prism-top" style="background: ${colors.top};"></div>
            `;

            meshContainer.appendChild(block);
            matrixBlocks.push({
                dom: block,
                currentHeight: 2,
                targetHeight: maxElevation,
                isBase: layerIndex === 0
            });
        }

        let runClock = 0;
        let trackedCellIndex = 12;
        let stepProgress = 0;

        function animationTick() {
            runClock++;

            // Fluid dynamic organic wave modification loop
            matrixBlocks.forEach((node, i) => {
                let waveValue = 0;
                if (!node.isBase) {
                    waveValue = Math.sin((runClock * 0.06) + i) * 8;
                }
                let computedH = Math.max(2, node.targetHeight + waveValue);
                
                node.currentHeight = computedH;
                node.dom.style.setProperty('--elevation', `${computedH}px`);
                
                const topFace = node.dom.querySelector('.prism-top');
                if(topFace) topFace.style.transform = `translateZ(${computedH}px)`;
            });

            // Handle physics-driven structural jump targeting path matrices
            stepProgress += 0.04;
            if(stepProgress >= 1) {
                stepProgress = 0;
                // Walk to adjacent non-empty cluster locations nearby randomly
                let step = [1, -1, 24, -24][Math.floor(Math.random() * 4)];
                let prospectiveIndex = trackedCellIndex + step;
                if(prospectiveIndex >= 0 && prospectiveIndex < totalElements) {
                    trackedCellIndex = prospectiveIndex;
                } else {
                    trackedCellIndex = Math.floor(Math.random() * totalElements);
                }
            }

            // Bind the coordinate position frames inside true DOM transformations
            const targetNode = matrixBlocks[trackedCellIndex].dom;
            const targetBounds = targetNode.getBoundingClientRect();
            const canvasBounds = targetNode.parentElement.parentElement.getBoundingClientRect();
            
            const positionX = targetBounds.left - canvasBounds.left + (targetBounds.width / 2);
            const trackingElevation = matrixBlocks[trackedCellIndex].currentHeight;
            
            const hopParabola = Math.sin(stepProgress * Math.PI) * 35;
            const positionY = (targetBounds.top - canvasBounds.top) - trackingElevation - hopParabola + 50;

            trackerNode.style.left = `${positionX}px`;
            trackerNode.style.top = `${positionY}px`;

            requestAnimationFrame(animationTick);
        }

        // Handle auto landing redirects safely 
        const countdownTask = setInterval(() => {
            countdown--;
            if (countdown <= 0) {
                clearInterval(countdownTask);
                timerText.innerText = "REDIRECTING...";
                window.location.href = "https://github.com/Linux56ax";
            } else {
                timerText.innerText = `REDIRECT: ${countdown}s`;
            }
        }, 1000);

        animationTick();
    </script>
</body>
</html>
